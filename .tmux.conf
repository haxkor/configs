# curl https://raw.githubusercontent.com/haxkor/configs/master/.tmux.conf > .tmux.conf

set-option -g default-shell /opt/homebrew/bin/fish
unbind-key -a

set-option -g prefix C-w
unbind-key C-w
bind-key C-w send-prefix
set -g base-index 1

# vi is good
setw -g mode-keys vi

set -sg escape-time 0        # kills the ESC delay in vim — the single biggest one
set -g focus-events on       # vim autoread / gitgutter refresh on focus
set -g history-limit 50000   # default 2000 is tiny
set -g pane-base-index 1     # match your base-index 1
set -g renumber-windows on   # no gaps after closing a window
setw -g aggressive-resize on # don't shrink to the smallest attached client
set -g allow-passthrough on  # image protocols (kitty graphics) through tmux

# mouse behavior
set -g mouse on

bind-key : command-prompt

bind-key space next-window
bind-key bspace previous-window
bind-key enter next-layout

# use vim-like keys for splits and windows
bind-key -n C-x split-window -h -c '#{pane_current_path}'
bind-key -n C-s split-window -v  -c '#{pane_current_path}'

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Direct pane switching, no prefix, no vim awareness
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R


bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l



set-window-option -g other-pane-height 25
set-window-option -g other-pane-width 80
set-window-option -g display-panes-time 1500
set-window-option -g window-status-current-style fg=magenta


bind-key -n C-f previous-window
bind-key -n C-g next-window
bind-key -n C-t new-window -c '#{pane_current_path}'

bind-key -n C-v copy-mode
bind-key -n C-p paste-buffer
# bind p paste-buffer

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

bind-key -T copy-mode-vi y     send -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'pbcopy'


# Scroll 1 line at a time instead of 5
bind -T copy-mode-vi WheelUpPane   send -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 1 scroll-down


# Status Bar
set-option -g status-interval 1
set -g status-style 'bg=default,fg=white'
set -g status-left '#[fg=green]#H #[default]'
set -g status-right ''

set-option -g pane-active-border-style fg=yellow
set-option -g pane-border-style fg=cyan


set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',*256col*:Tc'
set -ga terminal-features ',*:usstyle'   # undercurl for LSP diagnostics

# Allow the arrow key to be used immediately after changing windows
set-option -g repeat-time 0

bind-key -n C-b break-pane


bind-key S choose-tree -Zs   # session tree picker

# synch terminal titles
set -g set-titles on
set -g set-titles-string '#T - #W'
